name: Deploy to production droplet

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.repository }}
  cancel-in-progress: false

env:
  SERVICE_NAME: tracking-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Verify deploy configuration
        env:
          SSH_KEY: ${{ secrets.PROD_DROPLET_SSH_KEY }}
          HOST: ${{ secrets.PROD_DROPLET_HOST }}
          USER_NAME: ${{ secrets.PROD_DROPLET_USER }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
        run: |
          echo "::group::Secret presence (no content leaked)"
          if [ -z "$HOST" ]; then echo "::error::PROD_DROPLET_HOST is empty"; exit 1; fi
          if [ -z "$USER_NAME" ]; then echo "::error::PROD_DROPLET_USER is empty"; exit 1; fi
          if [ -z "$SSH_KEY" ]; then echo "::error::PROD_DROPLET_SSH_KEY is empty"; exit 1; fi
          if [ -z "$SERVICE_NAME" ]; then echo "::error::SERVICE_NAME env is empty"; exit 1; fi

          echo "PROD_DROPLET_HOST     length=${#HOST}"
          echo "PROD_DROPLET_USER     value=$USER_NAME"
          echo "SERVICE_NAME          value=$SERVICE_NAME"
          echo "PROD_DROPLET_SSH_KEY  length=${#SSH_KEY}"

          FIRST=$(printf "%s" "$SSH_KEY" | sed -n '1p')
          LAST=$(printf "%s" "$SSH_KEY" | tail -n 1)
          LINES=$(printf "%s" "$SSH_KEY" | wc -l | tr -d ' ')

          if ! printf "%s" "$FIRST" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "::error::Key does not start with a BEGIN ... PRIVATE KEY header"
            exit 1
          fi

          if ! printf "%s" "$LAST" | grep -q "END .*PRIVATE KEY"; then
            echo "::error::Key does not end with an END ... PRIVATE KEY footer"
            exit 1
          fi

          if [ "$LINES" -lt 6 ]; then
            echo "::error::Key looks collapsed — newlines may be stripped"
            exit 1
          fi

          echo "::notice::Deploy configuration checks passed"
          echo "::endgroup::"

      - name: SSH and deploy service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_DROPLET_HOST }}
          username: ${{ secrets.PROD_DROPLET_USER }}
          key: ${{ secrets.PROD_DROPLET_SSH_KEY }}
          command_timeout: 20m
          debug: false
          script: |
            echo "=== SSH connected ==="
            echo "host    : $(hostname)"
            echo "user    : $(whoami)"
            echo "date    : $(date -Is)"
            echo "service : ${{ env.SERVICE_NAME }}"
            echo "branch  : main"
            echo "=== Running deploy.sh ==="
            /home/hoizr/hoizr-stack/deploy.sh ${{ env.SERVICE_NAME }} main
